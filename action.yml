name: Mipiti Verify
description: Verify security controls against Mipiti threat models in CI. Runs typed assertions against your codebase and reports results.
branding:
  icon: shield
  color: blue

inputs:
  model-id:
    description: Mipiti threat model ID (omit if using all)
    required: false
    default: ""
  all:
    description: Verify all models in the workspace
    required: false
    default: "false"
  api-key:
    description: Mipiti API key (MIPITI_API_KEY)
    required: true
  base-url:
    description: API base URL
    required: false
    default: "https://api.mipiti.io"
  tier2-provider:
    description: "AI provider for Tier 2 verification: openai, anthropic, or ollama"
    required: false
    default: ""
  tier2-model:
    description: Model name (e.g. gpt-4o, claude-sonnet-4-5-20250514)
    required: false
    default: ""
  tier2-api-key:
    description: Provider API key (OpenAI or Anthropic)
    required: false
    default: ""
  tier2-consistency-n:
    description: "Tier-2 self-consistency: judgments per fresh evidence; a PASS needs all N to agree (default 3)"
    required: false
    default: ""
  project-root:
    description: Project root directory
    required: false
    default: "."
  reverify:
    description: Re-verify all assertions, not just pending (default true)
    required: false
    default: "true"
  dry-run:
    description: Run verifiers but don't submit results
    required: false
    default: "false"
  concurrency:
    description: Max concurrent Tier 2 LLM calls
    required: false
    default: "1"
  sigstore-tuf-url:
    description: Custom Sigstore TUF root URL for private deployments (default public sigstore.dev)
    required: false
    default: ""
  sigstore-trust-config:
    description: Path to a pre-downloaded Sigstore ClientTrustConfig JSON (out-of-band snapshot, skips all TUF network fetches)
    required: false
    default: ""
  workspace-signing-key:
    description: "Path to a PEM ECDSA P-256 private key for workspace-attested submission. Used when no OIDC token is available (e.g. self-hosted runners without id-token: write), or when signing-prefer=workspace. The matching public key must be registered on the Mipiti workspace."
    required: false
    default: ""
  signing-prefer:
    description: "When both an OIDC token and a workspace key are available, prefer this signer ('sigstore' or 'workspace'). Default: sigstore."
    required: false
    default: "sigstore"
  require-attestation:
    description: "Fail the run when no attestation is produced (Sigstore or workspace-ECDSA). Default behaviour is to log a warning and submit unsigned when both signers are unavailable; with this flag, the runner exits non-zero. Set to 'true' for security-sensitive CI gates."
    required: false
    default: "false"
  junit-report:
    description: "Path to a JUnit XML report your test step already produced, relative to project-root. When set, the action records a signed attestation of that run before verifying, which is what test_attested assertions are checked against. Space-separate several paths for a repository with more than one suite. This action never runs your tests; it reads the report your own step wrote."
    required: false
    default: ""
  attestation-env:
    description: "Environment variable names whose values the attestation should record, space- or comma-separated (e.g. 'FEATURE_AUTH ENFORCE_TLS'). A test suite can pass with the control it exercises switched off, and assertions over files in the tree describe the configuration the repository declares rather than the one the run had; recording the names here lets an assertion require that the run ran with a control on. Only the names given are recorded, never the whole environment, and credential-looking names are refused."
    required: false
    default: ""
  attestation-signing-key:
    description: "Path to an ECDSA P-256 private key (PEM) used to sign the test-result attestation on CI that has no workload identity. Leave unset on GitHub Actions: the run already mints an OIDC token and the attestation is signed keylessly through Sigstore, which needs no secret and binds the repository, ref and workflow."
    required: false
    default: ""
  coverage-report:
    description: "Path to a coverage.py JSON export with contexts (run the tests with --cov-context=test, then 'coverage json --show-contexts'), relative to project-root. Passed to attest-tests --coverage so each recorded test carries the files and lines it reached, which is what a test_attested assertion's 'reached' fact is computed from."
    required: false
    default: ""
  dependence-pairs:
    description: "Space-separated test=file::symbol pairs (e.g. 'tests/test_auth.py::test_token_required=app/auth.py::require_token'). When set, the action runs 'attest-dependence' before verifying: each named test is run once with its mechanism disabled through the project's runner (a stub for Python, a mocking setup file for jest/vitest/mocha, a compile-checked source mutation restored afterwards for Go, Rust, JVM, .NET, C/C++, Swift and HDL), and the outcome is signed into a dependence attestation. This input RUNS TESTS; it is opt-in. Leave unset to keep the action read-only."
    required: false
    default: ""
  reach-pairs:
    description: "Space-separated test=file::symbol pairs. When set, the action runs 'attest-reach' before verifying: each named test is run alone under the language's coverage tool through the project's runner, and the lines it executed in the mechanism's file are signed into a reach attestation, which is what the 'reached' fact of a test_attested assertion is computed from for runners other than pytest-with-coverage.py. This input RUNS TESTS; it is opt-in."
    required: false
    default: ""
  runner:
    description: "Runner adapter for dependence-pairs and reach-pairs: pytest, jest, vitest, mocha, go, cargo, maven, gradle, dotnet, rspec, phpunit or command. Default: detected from the project's files. The 'command' runner takes run-cmd."
    required: false
    default: ""
  run-cmd:
    description: "For the 'command' runner: the command that runs one test, with {test} substituted (e.g. 'make sim TEST={test}'); exit 0 is passed, 1 failed, anything else error. Setting it selects the command runner."
    required: false
    default: ""
  coverage-cmd:
    description: "For the 'command' runner with reach-pairs: the command that runs one test under coverage ({test} substituted). Defaults to run-cmd."
    required: false
    default: ""
  coverage-file:
    description: "For the 'command' runner with reach-pairs: the report the coverage command writes, relative to project-root (LCOV, Cobertura, JaCoCo or coverage.py JSON). With suite-cmd, the report the suite run writes."
    required: false
    default: ""
  suite-cmd:
    description: "Suite mode, for harnesses that cannot select one test. For dependence-pairs: a command that runs the whole suite and writes a JUnit report; run once per distinct mechanism with that mechanism disabled, each nominated test taking its outcome from the report (needs suite-junit). For reach-pairs: the same command must also write the coverage report coverage-file names; it runs ONCE and each nominated test records what the suite reached in its mechanism's file as suite_reached (reach_scope = suite). Suite-level reach is information only: it never establishes the per-test reach fact, which stays unknown."
    required: false
    default: ""
  suite-junit:
    description: "Suite mode for dependence-pairs: the JUnit report suite-cmd writes, relative to project-root."
    required: false
    default: ""
  strategy:
    description: "How a compiled mechanism is disabled for dependence-pairs and reach-pairs: 'mutation' (default; rewrite the body, recompile per mechanism) or 'hook' (build once with the repository's build-flagged tripwires compiled in, name the mechanism per run; credited only with the location proof and a passing control run)."
    required: false
    default: ""
  build-cmd:
    description: "For the 'command' runner under strategy 'hook': the build with the hooks compiled in, run once."
    required: false
    default: ""

outputs:
  content-hash:
    description: "SHA-256 content hash of verified assertions (sha256:<hex>). Use with actions/attest-build-provenance for Sigstore attestation."

runs:
  using: docker
  image: docker://ghcr.io/mipiti/mipiti-verify:v0.55.0@sha256:c62818bbc2b9322efcbdbfc4fd341f18de1907d4282d79c933069050e2f4b585
  env:
    MIPITI_API_KEY: ${{ inputs.api-key }}
    MIPITI_BASE_URL: ${{ inputs.base-url }}
    INPUT_TIER2_API_KEY: ${{ inputs.tier2-api-key }}
    INPUT_MODEL_ID: ${{ inputs.model-id }}
    INPUT_ALL: ${{ inputs.all }}
    INPUT_PROJECT_ROOT: ${{ inputs.project-root }}
    INPUT_TIER2_PROVIDER: ${{ inputs.tier2-provider }}
    INPUT_TIER2_MODEL: ${{ inputs.tier2-model }}
    INPUT_TIER2_CONSISTENCY_N: ${{ inputs.tier2-consistency-n }}
    INPUT_REVERIFY: ${{ inputs.reverify }}
    INPUT_DRY_RUN: ${{ inputs.dry-run }}
    INPUT_CONCURRENCY: ${{ inputs.concurrency }}
    INPUT_SIGSTORE_TUF_URL: ${{ inputs.sigstore-tuf-url }}
    INPUT_SIGSTORE_TRUST_CONFIG: ${{ inputs.sigstore-trust-config }}
    INPUT_WORKSPACE_SIGNING_KEY: ${{ inputs.workspace-signing-key }}
    INPUT_SIGNING_PREFER: ${{ inputs.signing-prefer }}
    INPUT_REQUIRE_ATTESTATION: ${{ inputs.require-attestation }}
    INPUT_JUNIT_REPORT: ${{ inputs.junit-report }}
    INPUT_ATTESTATION_SIGNING_KEY: ${{ inputs.attestation-signing-key }}
    INPUT_ATTESTATION_ENV: ${{ inputs.attestation-env }}
    INPUT_COVERAGE_REPORT: ${{ inputs.coverage-report }}
    INPUT_DEPENDENCE_PAIRS: ${{ inputs.dependence-pairs }}
    INPUT_REACH_PAIRS: ${{ inputs.reach-pairs }}
    INPUT_RUNNER: ${{ inputs.runner }}
    INPUT_RUN_CMD: ${{ inputs.run-cmd }}
    INPUT_COVERAGE_CMD: ${{ inputs.coverage-cmd }}
    INPUT_COVERAGE_FILE: ${{ inputs.coverage-file }}
    INPUT_SUITE_CMD: ${{ inputs.suite-cmd }}
    INPUT_SUITE_JUNIT: ${{ inputs.suite-junit }}
    INPUT_STRATEGY: ${{ inputs.strategy }}
    INPUT_BUILD_CMD: ${{ inputs.build-cmd }}
