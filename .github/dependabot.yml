version: 2
updates:
  # Action pins are full commit SHAs with a version comment; Dependabot
  # bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The Dockerfile base image is digest-pinned; this keeps the digest
  # moving with upstream python:3.12-slim rebuilds.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
