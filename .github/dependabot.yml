version: 2
updates:
  # Action pins are full commit SHAs with a version comment; Dependabot
  # bumps both together. All action bumps arrive as ONE pull request: one
  # CI run per week, not one per action. An automatic rebase on every
  # change to main would restart that run, so rebases are done by hand
  # when it is time to merge.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    rebase-strategy: "disabled"
    groups:
      github-actions:
        patterns:
          - "*"

  # The Dockerfile base image is digest-pinned; this keeps the digest
  # moving with upstream python:3.12-slim rebuilds. The Python line is a
  # deliberate choice for the published action image, so major and minor
  # version changes of the base image are not offered here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
