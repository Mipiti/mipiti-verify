name: Doc count gate

# Validates that <!--KEY-->VALUE<!--/KEY--> markers in .md files match
# canonical-counts.sh. Runs on every PR including markdown-only
# changes — doc drift is exactly the .md case.

on:
  pull_request:
    branches: [main]

jobs:
  doc-counts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Read-only gate: nothing pushes, so the token has no business
          # staying in .git/config.
          persist-credentials: false
      - name: Run gate
        run: bash scripts/check-doc-counts.sh
