name: CI

# Runs on PRs only. Every merge to main comes via a PR that had to pass
# this same CI (required status check + required-up-to-date-branch), so
# re-running on main after squash-merge tests an identical tree — pure
# duplication. Dropping the push:main trigger saves ~5 min × N
# bot-auto-merged PRs per release.
#
# Markdown-only PRs still run this workflow, and its jobs report as
# they always do; what they skip is the suite, via the `docs_only`
# output below. The filter used to live on the trigger, which meant
# this workflow did not run at all on a docs PR and a second workflow
# had to post the same check names so the PR was not blocked waiting
# for statuses nobody would send. Two workflows publishing one set of
# contexts is only safe while exactly one of them runs, and that does
# not hold: `paths-ignore` skips a run when EVERY changed file matches,
# while `paths` starts one when ANY does, so a PR touching a .md file
# and code — the shape of most changes here, since the CHANGELOG moves
# with them — ran both, and every required context was posted twice,
# once by a job that did the work and once by a job that echoed a line.
# GitHub calls duplicate contexts ambiguous and does not define which
# one a required check reads. So the skip moved off the trigger and
# into the jobs, and this is the only workflow that posts these names.

on:
  pull_request:
    branches: [main]

jobs:
  # Single shared inert-path determination, consumed (fail-safe) by the
  # required formal jobs below. inert=true ONLY when EVERY changed file
  # is provably inert — path-inert: .github/workflows/**, **/*.md;
  # content-inert: pyproject.toml version-line only, action.yml Docker
  # image-line only. Fails OPEN: empty/ambiguous ⇒ inert=false; and on
  # ANY non-success of this job the consumers' `result != 'success'`
  # clause forces the formal work to RUN (never skip-and-report). The
  # step never aborts (set +e; exit 0) so detect-changes stays green
  # and the verdict is carried by the output, not the job status.
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      inert: ${{ steps.guard.outputs.inert }}
      #: Every changed file is markdown. Narrower than `inert`, which also
      #: admits workflow files and version-line-only edits: those must still
      #: run the suite, a prose change need not. This is exactly the set the
      #: retired docs-only workflow stubbed, so the cost it saved is kept.
      docs_only: ${{ steps.guard.outputs.docs_only }}
    steps:
      - name: Inert-path guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          files=$(gh pr view "$PR" --repo "$REPO" --json files \
            --jq '.files[].path' 2>/dev/null)
          echo "Changed files:"; printf '%s\n' "$files"
          inert=true
          docs_only=true
          # No file list means the question could not be asked, so neither
          # verdict is safe to assert: both fail open and the work runs.
          [ -z "$files" ] && inert=false && docs_only=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|*/*.md) ;;
              *) docs_only=false ;;
            esac
            case "$f" in
              .github/workflows/*|*.md|*/*.md) ;;
              pyproject.toml)
                bad=$(gh pr diff "$PR" --repo "$REPO" --patch 2>/dev/null | awk '
                  /^diff --git .*pyproject\.toml/ {inf=1; next}
                  /^diff --git / {inf=0}
                  inf && /^[+-]/ && !/^(\+\+\+|---)/ {
                    if ($0 !~ /^[+-]version = ".*"$/) print }')
                [ -n "$bad" ] && inert=false ;;
              action.yml)
                bad=$(gh pr diff "$PR" --repo "$REPO" --patch 2>/dev/null | awk '
                  /^diff --git .*action\.yml/ {inf=1; next}
                  /^diff --git / {inf=0}
                  inf && /^[+-]/ && !/^(\+\+\+|---)/ {
                    if ($0 !~ /docker:\/\/|^[+-][ \t]*image:/) print }')
                [ -n "$bad" ] && inert=false ;;
              *) inert=false ;;
            esac
          done <<< "$files"
          echo "inert=$inert" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Inert (skip expensive formal jobs/steps): $inert"
          echo "Docs-only (skip the suite): $docs_only"
          exit 0

  test:
    runs-on: ubuntu-latest
    needs: detect-changes
    # Always run + report (required check). `always()` overrides the
    # default needs-skip so a detect-changes failure can't bypass the
    # gate; the expensive formal steps below self-gate fail-safe.
    if: ${{ always() }}
    # NO `id-token: write` here — many runner tests (e.g.
    # TestChooseAttestation) assume OIDC env vars are absent, and the
    # runner constructor auto-detects ACTIONS_ID_TOKEN_REQUEST_*
    # whenever they're present. Granting id-token to this job would
    # make the auto-detect path fire in tests that explicitly pass
    # `oidc_token=None`, breaking ~15 assume-no-OIDC tests. The BFS
    # spec test that needs real Fulcio bundles runs in a separate
    # job (test-spec-invariants) below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # CI is read-only: runs tests, formal checks, type-checking. No
          # step does `git push` / `git commit`. Drop the token from
          # .git/config so a future step can't accidentally reuse it.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: pip-audit (all four lockfiles)
        # Catches newly-published CVEs against already-pinned versions at
        # PR time. --disable-pip audits the lockfile directly without a
        # separate venv install. The audit tool itself is installed
        # hash-pinned via requirements-audit.lock (consistent with
        # requirements.lock / requirements-build.lock) so a swapped
        # pip-audit wheel can't compromise the audit step. Runs on
        # every PR including docs-only — new CVEs are disclosed
        # continuously and the inert guard would mask them.
        #
        # --ignore-vuln PYSEC-2025-183: pyjwt "weak encryption"
        # advisory — disputed by the pyjwt maintainer (per the OSV
        # entry: "the key length is chosen by the application that
        # uses the library"). All pyjwt versions are flagged (affected
        # from 0; no fix exists or is planned). pyjwt enters our
        # lockfile transitively via sigstore, which selects its own
        # well-vetted key strengths/algorithms — the small-key edge
        # case the disputed advisory is about does not apply to this
        # usage. Re-evaluate if pyjwt's maintainers later accept the
        # claim and ship a hardened release; remove the ignore then.
        #
        # --ignore-vuln GHSA-qp9x-wp8f-qgjj: python-tuf 6.0.0
        # delegation path-pattern matching is case-insensitive on
        # Windows (fnmatch.fnmatch calls os.path.normcase, identity on
        # posixpath but lowercasing on ntpath). The advisory states
        # "No effect on Linux/macOS." mipiti-verify runs in CI on
        # Linux/macOS runners; the affected codepath is unreachable.
        # tuf enters our lockfile transitively via sigstore, and the
        # fix requires sigstore>=5 (sigstore 4.x is the latest release
        # and pins tuf<7), so the upgrade is blocked upstream.
        # Re-evaluate when sigstore 5.x ships. Same ignore is applied
        # in the parent repo's ci.yml for the same reasoning.
        run: |
          pip install --require-hashes -r requirements-audit.lock
          IGNORE='--ignore-vuln PYSEC-2025-183 --ignore-vuln GHSA-qp9x-wp8f-qgjj'
          pip-audit -r requirements.lock       --disable-pip $IGNORE
          pip-audit -r requirements-build.lock --disable-pip $IGNORE
          pip-audit -r requirements-all.lock   --disable-pip $IGNORE
          pip-audit -r requirements-dev.lock   --disable-pip $IGNORE

      - name: Install parsers for the definition locators
        # The formal checkers over definition location (formal/check_adapters.py,
        # A2/A5 parser arms) and the type checker's catalogue properties need the
        # optional parser pack and the assertion catalogue; both hash-pinned via
        # requirements-all.lock / requirements-dev.lock.
        run: pip install --require-hashes -r requirements-all.lock

      - name: Install package and dev extras
        run: pip install --no-deps -e . && pip install --require-hashes -r requirements-dev.lock

      # The HDL toolchains, and only those. Every other language a source
      # mutation checks is checked with the tool that also runs that
      # project's tests -- cargo check beside cargo test, go build beside
      # go test -- so it cannot plausibly be absent where verification is
      # meaningful. Verilog and VHDL are the exception: a team on a
      # commercial simulator has none of verilator, slang, iverilog, ghdl
      # or nvc, so the missing-analyser branch is the one with a live
      # failure mode in the field, and it is the one the suite could not
      # reach on a runner image that ships none of them.
      - name: Install HDL toolchains for the end-to-end mutation tests
        if: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.docs_only != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog verilator ghdl

      - name: Run tests (excluding spec-invariants which needs Fulcio OIDC)
        # The declared toolchains must be present rather than silently
        # skipped: a skipif is invisible in a green run, so a runner image
        # that stopped shipping one would quietly return the suite to the
        # coverage this step exists to end.
        # A prose-only change cannot alter what the suite asserts, and this
        # is the step the retired docs-only workflow existed to avoid. The
        # job still reports, so the required context is satisfied either
        # way; fail-safe, so an unanswerable diff runs the suite.
        if: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.docs_only != 'true' }}
        env:
          MIPITI_TEST_REQUIRE_TOOLCHAINS: "iverilog vvp verilator ghdl go cc javac"
        run: python -m pytest -v --ignore=tests/test_spec_invariants.py

      - name: Formal verification (Python BFS + cross-check)
        # Fail-safe inert skip: RUN unless detect-changes succeeded AND
        # judged the diff inert. detect-changes failure ⇒ runs.
        if: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.inert != 'true' }}
        run: python formal/check_pipeline.py

      - name: Download TLC
        if: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.inert != 'true' }}
        run: |
          TLC_URL="https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          TLC_SHA="936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
          curl -sL "$TLC_URL" -o tla2tools.jar
          echo "$TLC_SHA  tla2tools.jar" | sha256sum -c
        working-directory: formal

      - name: Formal verification (TLC — VerificationPipeline + KeySourceResolver)
        if: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.inert != 'true' }}
        run: |
          # JVM tuning is precision-preserving: -Xmx8g for the BFS
          # young-gen, ParallelGC for throughput. State-space verdict
          # is unchanged.
          JAVA_OPTS="-Xmx8g -XX:+UseParallelGC"
          echo "--- TLC: VerificationPipeline reverify=false ---"
          java $JAVA_OPTS -jar tla2tools.jar -config VerificationPipeline.cfg -workers auto VerificationPipeline.tla
          echo "--- TLC: VerificationPipeline reverify=true ---"
          java $JAVA_OPTS -jar tla2tools.jar -config VerificationPipeline_reverify.cfg -workers auto VerificationPipeline.tla
          echo "--- TLC: KeySourceResolver (issuer-side resolver invariants R1-R6, R10, R12 + R3a) ---"
          java $JAVA_OPTS -jar tla2tools.jar -config KeySourceResolver.cfg -workers auto KeySourceResolver.tla
          echo "--- TLC: Tier2RunnerSide (runner-side tier-2 rendering invariants T1-T5) ---"
          java $JAVA_OPTS -jar tla2tools.jar -config Tier2RunnerSide.cfg -workers auto Tier2RunnerSide.tla
        working-directory: formal

  audit-tlc:
    # Audit-spec TLC verification — matrix over the 6 compositional
    # cfgs covering the legacy results_hash signature path plus 2
    # cfgs covering the manifest signature path (Option β; see
    # docs/audit-pack-signing.md in the parent repo and
    # formal/audit_manifest.tla in this submodule). The 5 Config-1
    # per-key_source sub-configs (audit_main_sigstore / _platform /
    # _workspace / _cdsse / _orphan / _legacy) + the five Config-2
    # per-key_source sub-configs (audit_bind_*) cover the legacy path; audit_manifest_platform
    # and audit_manifest_workspace cover the manifest path on the two
    # key_source classes where it is the trust anchor. Each matrix
    # instance runs the cheap static checks (AuditView AST
    # faithfulness + Config-1 partition totality) then its one TLC
    # config. Wall-clock = max(per-cfg time); cdsse is the slow one
    # (~9 min in local validation, dominated by customer_dsse
    # predicate-canonicalisation per-state cost), other sub-configs
    # ~1-5 min; audit_manifest_* run in ~1-2s locally. ~7× wall-clock
    # improvement vs the previous monolithic Config-1 (~1 h+).
    #
    # Each matrix instance reports as `audit-tlc (<cfg>)`. Required-
    # check ruleset rules referring to plain `audit-tlc` must be
    # updated to require each `audit-tlc (<cfg>)` context (or an
    # aggregate gate) — see formal/COMPOSITION.md "CI job split".
    #
    # Skip-gating identical to before: expensive TLC step skipped
    # only when detect-changes succeeded AND judged the diff inert
    # (path-inert: .github/workflows/**, pyproject.toml, **/*.md);
    # any change to implementation / tests / formal/** runs full
    # TLC. Cheap static checks (AST proof + totality) stay
    # unconditional — they take seconds.
    runs-on: ubuntu-latest
    needs: detect-changes
    # `always()` keeps the matrix running even if detect-changes
    # failed (fail-safe: TLC step inside re-evaluates the verdict and
    # defaults to running). The one case that skips the matrix outright
    # is a prose-only diff, where even the cheap static checks read code
    # that did not change; `audit-tlc-all` accepts that skip only under
    # the same verdict, so a skip for any other reason still fails the
    # gate. The required context is `audit-tlc-all`, not these.
    if: ${{ always() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.docs_only != 'true') }}
    permissions:
      contents: read
    strategy:
      # fail-fast: false so all matrix instances run to completion —
      # if one sub-config fails (real spec break or new vulnerability
      # introduced), we want to see whether ONLY that one fails or
      # whether multiple do. Per-cfg diagnostics on every PR.
      fail-fast: false
      matrix:
        cfg:
          - audit_main_sigstore
          - audit_main_platform
          - audit_main_workspace
          - audit_main_cdsse
          - audit_main_orphan
          - audit_main_legacy
          - audit_bind_sigstore
          - audit_bind_platform
          - audit_bind_workspace
          - audit_bind_orphan
          - audit_bind_legacy
          # Manifest-signature path (Option β) per-key_source slices.
          # See formal/audit_manifest.tla module comment for the
          # KS_PLATFORM / KS_WORKSPACE partition argument.
          - audit_manifest_platform
          - audit_manifest_workspace
          # Scenario-knob slices (V6..V12). Each runs <10s locally on
          # the configured constants — well under any other audit-tlc
          # job's wall-clock, so they only add ~10s × 4 = 40s of net
          # serial work, parallelised onto separate runners. Sharded
          # per scenario × scenario-value so the .cfg file pinning
          # remains simple. See audit-README.md "Scenario-knob slices".
          - audit_main_orphan_results_blocked
          - audit_main_orphan_results_allowed
          - audit_main_model_only
          - audit_main_sufficiency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Formal verification (AuditView faithfulness — AST proof)
        # ~seconds. Gates the lossless `VIEW AuditView` reduction in
        # every audit-spec cfg. Structurally proves every cfg invariant
        # observes the collapsed customer_dsse fields only via
        # (in)equality, so each factors through the view ⇒ the
        # reduction loses no invariant violation. Sound over-
        # approximation; fails closed on any unprovable reference.
        # Cheap to run per-matrix-instance.
        run: python formal/check_audit_view_faithful.py

      - name: Config-1 partition totality + disjointness check
        # ~seconds. Asserts the 5 audit_main_*.cfg sub-configs'
        # `allowedKS` sets union to KeySources exactly and are
        # pairwise disjoint. Fails closed with a precise diagnostic
        # if any key_source value is uncovered (a row of that class
        # would never be enumerated by any sub-config) or if two
        # sub-configs share a class (wasted coverage). Cheap to run
        # per-matrix-instance.
        run: python formal/check_audit_partition_total.py

      - name: Download TLC
        if: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.inert != 'true' }}
        run: |
          TLC_URL="https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          TLC_SHA="936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
          curl -sL "$TLC_URL" -o tla2tools.jar
          echo "$TLC_SHA  tla2tools.jar" | sha256sum -c
        working-directory: formal

      - name: Formal verification (TLC — ${{ matrix.cfg }})
        if: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.inert != 'true' }}
        # One TLC run per matrix instance. The 5 Config-1 sub-configs
        # pin bundle_bind to "matching, valid" (canonical
        # representative) and partition the key_source space; their
        # union covers Config 1's reachable state space (mechanically
        # checked by the totality step above). audit_bundle_bind
        # explores the full bundle_bind cross-product with pins=NONE.
        # audit_manifest_platform / audit_manifest_workspace use the
        # standalone audit_manifest.tla module which models the
        # manifest signature path (Option β) independently of audit.tla.
        # See formal/COMPOSITION.md and formal/audit_manifest.tla.
        env:
          CFG: ${{ matrix.cfg }}
        run: |
          JAVA_OPTS="-Xmx8g -XX:+UseParallelGC"
          case "$CFG" in
            audit_manifest_*) TLA_MODULE=audit_manifest.tla ;;
            *)                TLA_MODULE=audit.tla ;;
          esac
          java $JAVA_OPTS -jar tla2tools.jar -config "$CFG.cfg" -workers auto "$TLA_MODULE"
        working-directory: formal

  # One context standing for the whole audit-tlc matrix.
  #
  # The ruleset used to require each `audit-tlc (<cfg>)` by name, which
  # makes the required set a hand-kept copy of a matrix that grows: two
  # PRs added configs and neither updated the ruleset, so six of the
  # seventeen ran without being required and could fail while the PR
  # stayed mergeable — among them the sufficiency, model-only and
  # manifest-signature slices. Requiring this one job instead means the
  # matrix can gain a config without anyone remembering a second place.
  #
  # `needs` on a matrix job yields one result for the whole matrix:
  # success only if every instance succeeded. `always()` so a cancelled
  # or skipped matrix is reported rather than silently satisfying the
  # gate by not running.
  audit-tlc-all:
    name: audit-tlc-all
    runs-on: ubuntu-latest
    needs: [detect-changes, audit-tlc]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Every audit-tlc config succeeded
        env:
          RESULT: ${{ needs.audit-tlc.result }}
          GUARD: ${{ needs.detect-changes.result }}
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
        run: |
          if [ "$RESULT" = "success" ]; then
            echo "audit-tlc: every config succeeded"
            exit 0
          fi
          # A skip counts only where the guard ANSWERED and said the diff
          # is prose. A skip for any other reason -- a cancelled matrix, a
          # guard that could not answer -- is not an argument that the
          # specs still hold.
          if [ "$RESULT" = "skipped" ] && [ "$GUARD" = "success" ] && [ "$DOCS_ONLY" = "true" ]; then
            echo "audit-tlc: skipped, prose-only diff"
            exit 0
          fi
          echo "::error::audit-tlc matrix result is '$RESULT' (guard=$GUARD docs_only=$DOCS_ONLY)"
          exit 1

  test-spec-invariants:
    # Dedicated job for the audit-spec BFS implementation check
    # (tests/test_spec_invariants.py). Bundle-present rows mint real
    # Sigstore bundles via Fulcio using the workflow's own OIDC
    # token, so this job needs `id-token: write`. Isolated from the
    # main `test` job so OIDC env vars don't leak into runner tests
    # that assume their absence. Forks don't get OIDC tokens (GitHub
    # security model), so fork-PR runs of this job detect the
    # absence at runtime and skip the bundle rows rather than fail.
    #
    # Skipped on automated version-bump PRs (head branch
    # `release/v*`, title `chore: release v*`). Those PRs only edit
    # pyproject.toml's version string — they don't touch the spec,
    # the implementation, or any code path the BFS exercises. The
    # heavy Fulcio-OIDC-minting run adds no signal there. Required-
    # check satisfaction is preserved: a job skipped via job-level
    # `if:` reports `conclusion: skipped`, which satisfies a
    # required status check.
    needs: detect-changes
    # Skip (reported `skipped` ⇒ required check satisfied) only when
    # detect-changes succeeded AND judged the diff inert, OR on the
    # automated version-bump branch. `always()` keeps the job RUNNING
    # if detect-changes did not succeed — fail-safe: the BFS runs, it
    # is never bypassed by an infra failure.
    if: ${{ always() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.inert != 'true') && !startsWith(github.head_ref, 'release/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install package and dev extras
        run: pip install --no-deps -e . && pip install --require-hashes -r requirements-dev.lock

      - name: Run audit-spec BFS implementation check
        # The (Package, Pins) space is swept once per process, in a
        # module-scoped fixture, and every invariant is one test over
        # the collected rows. One process: under xdist each worker
        # would sweep the whole space (and mint its own bundle set)
        # for the few tests it is handed, so parallelism would only
        # multiply the work.
        run: python -m pytest -v tests/test_spec_invariants.py
